name: Docker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Valida o Dockerfile que o Render usa no deploy (quebra aqui,
      # e não só na hora de publicar). Sem push: só prova que compila.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
  deploy:
    # Dispara o deploy no Render via Deploy Hook após o merge na main.
    # Configure o segredo RENDER_DEPLOY_HOOK (Render → serviço → Settings).
    # Sem o segredo, o job é pulado e o auto-deploy do Blueprint continua valendo.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Sem RENDER_DEPLOY_HOOK; mantido o auto-deploy do Blueprint."
            exit 0
          fi
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
